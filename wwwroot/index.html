<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Akış</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">Akış</div>
  <nav class="views" aria-label="Görünüm">
    <button data-view="live" aria-pressed="true">Canlı</button>
    <button data-view="history" aria-pressed="false">Geçmiş</button>
  </nav>
  <label class="search"><span class="sr">Ara</span><input id="q" type="search" placeholder="Uygulama, alan adı veya IP ara" autocomplete="off"></label>
</header>

<div id="error" class="error" role="alert" hidden></div>
<div id="service" class="notice" role="status" hidden><span id="service-text"></span><button class="btn primary" id="install" hidden>Servisi kur</button></div>

<main id="live">
  <section class="flow" aria-label="Toplam trafik">
    <div class="meters">
      <div class="meter up"><span class="label">Yükleme</span><span class="value" id="up">0</span></div>
      <div class="meter down"><span class="label">İndirme</span><span class="value" id="down">0</span></div>
      <div class="session" id="session"></div>
    </div>
    <canvas id="river" aria-hidden="true"></canvas>
  </section>

  <section class="table" aria-label="Uygulamalar">
    <div class="thead">
      <span></span>
      <button data-sort="name">Uygulama</button>
      <button data-sort="down" class="num">İndirme</button>
      <button data-sort="up" class="num">Yükleme</button>
      <button data-sort="total" class="num">Bu oturumda</button>
      <button data-sort="conns" class="num">Bağlantı</button>
      <span></span>
    </div>
    <div id="apps"></div>
    <p id="empty" class="empty" hidden>Henüz trafik yok. Bir uygulama internete bağlandığında burada görünür.</p>
  </section>
</main>

<main id="history" hidden>
  <div class="range" role="group" aria-label="Zaman aralığı">
    <button data-days="1">Bugün</button>
    <button data-days="7" aria-pressed="true">7 gün</button>
    <button data-days="30">30 gün</button>
    <button data-days="90">90 gün</button>
  </div>
  <section class="summary" aria-label="Toplam kullanım">
    <div class="stat lead"><span class="label" id="sum-label">Son 7 günde toplam</span><span class="value" id="sum-total">0</span></div>
    <div class="stat down"><span class="label">İndirme</span><span class="value" id="sum-down">0</span></div>
    <div class="stat up"><span class="label">Yükleme</span><span class="value" id="sum-up">0</span></div>
    <div class="stat all"><span class="label">Tüm kayıtlar<em id="sum-since"></em></span><span class="value" id="sum-all">0</span></div>
  </section>
  <section class="days" id="days" aria-label="Günlük kullanım"></section>
  <section class="table" aria-label="Uygulama bazında kullanım">
    <div class="thead hist">
      <span></span><span>Uygulama</span><span class="num">İndirme</span><span class="num">Yükleme</span><span class="num">Toplam</span>
    </div>
    <div id="happs"></div>
    <p id="hempty" class="empty" hidden>Bu aralıkta kayıtlı kullanım yok.</p>
  </section>
</main>

<footer class="foot">IP konum verisi: DB-IP.com (CC BY 4.0)</footer>
<div id="toast" class="toast" role="status" hidden></div>

<script src="mock.js"></script>
<script src="app.js"></script>
</body>
</html>
